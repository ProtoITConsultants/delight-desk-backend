name: Deploy Delight Desk

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Copy project to server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "mkdir -p ~/delight-desk"
          rsync -avz --exclude 'node_modules' ./ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/delight-desk/

      - name: Build & run production container
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            cd ~/delight-desk
            # Pull latest image or build locally
            docker compose -f docker-compose.yml -f docker-compose.prod.yml build
            # Run migrations
            docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm app npm run db:migrate:prod
            # Start/Update container
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
            # Optional: prune old images
            docker image prune -f
          EOF
