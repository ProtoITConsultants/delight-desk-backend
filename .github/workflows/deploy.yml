name: Deploy Backend

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install all dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm build

      - name: Prepare deployment bundle
        run: |
          mkdir deploy
          cp -R dist package.json pnpm-lock.yaml deploy/
          cd deploy && tar -czf ../deploy.tar.gz .

      - name: Upload bundle to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: deploy.tar.gz
          target: /home/ubuntu/delight-desk-backend/

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/delight-desk-backend

            # Clean old files
            rm -rf dist package.json pnpm-lock.yaml

            # Extract new build
            tar -xzf deploy.tar.gz -C .
            rm deploy.tar.gz

            # Install production dependencies
            pnpm install --prod --frozen-lockfile

            # Restart application
            pm2 restart delight-desk --update-env || pm2 start dist/src/main.js --name delight-desk
            pm2 save
