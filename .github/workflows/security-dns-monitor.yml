name: Security DNS Monitor

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dns-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run DNS security check
        run: npm run security:dns-check

      - name: Upload DNS security report
        uses: actions/upload-artifact@v4
        with:
          name: security-dns-report
          path: security-dns-report.json
