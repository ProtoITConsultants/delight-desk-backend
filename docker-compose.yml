services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: delight-desk-dev
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@db:5432/delightdesk_dev
    ports:
      - '3000:3000'
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: delight-desk-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: delightdesk_dev
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
